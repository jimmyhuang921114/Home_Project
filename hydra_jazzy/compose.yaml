services:
  hydra-jazzy:
    image: home-project-hydra-jazzy:latest
    build:
      context: .
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
        USERNAME: work
    container_name: home_project_hydra_jazzy
    network_mode: host
    ipc: host
    shm_size: 16gb
    runtime: nvidia
    privileged: true
    stdin_open: true
    tty: true
    environment:
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/.docker.xauth
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: "40"
      ROS_LOCALHOST_ONLY: "0"
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      CYCLONEDDS_URI: file:///etc/cyclonedds/cyclonedds.xml
    volumes:
      - /home/jimmy/work_ws/Hydra_Ws:/workspace/Hydra_Ws:rw
      - /home/jimmy/work_ws/Home_Project/runtime:/workspace/home_project_runtime:rw
      - /home/jimmy/work_ws/Home_Project/artifacts:/workspace/home_project_artifacts:rw
      - /home/jimmy/work_ws/Home_Project/reports/artifacts:/workspace/home_project_reports/artifacts:ro
      - /home/jimmy/work_ws/Home_Project/scripts/replay_exact_bundle_for_hydra.py:/workspace/home_project_tools/replay_exact_bundle_for_hydra.py:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth:ro
      - /dev:/dev
    devices:
      - /dev/dri:/dev/dri
    command: ["tail", "-f", "/dev/null"]
