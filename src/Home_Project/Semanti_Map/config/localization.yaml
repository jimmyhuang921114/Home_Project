amcl:
  ros__parameters:
    use_sim_time: true

    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: "/scan"

    tf_broadcast: true
    transform_tolerance: 0.5
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    # 先不要讓 AMCL 覺得 odom 超級爛，否則很容易跳去相似房間
    alpha1: 0.12
    alpha2: 0.10
    alpha3: 0.15
    alpha4: 0.10
    alpha5: 0.03

    laser_model_type: "likelihood_field"
    laser_min_range: 0.12
    laser_max_range: 3.0
    laser_likelihood_max_dist: 0.6

    max_beams: 160

    sigma_hit: 0.10
    z_hit: 0.88
    z_short: 0.02
    z_max: 0.02
    z_rand: 0.08

    min_particles: 2000
    max_particles: 6000

    update_min_d: 0.05
    update_min_a: 0.05
    resample_interval: 1

    pf_err: 0.03
    pf_z: 0.99

    do_beamskip: false

    # 重要：先關掉 recovery，避免跳到另一個房間
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    save_pose_rate: 0.5


map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""


map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true