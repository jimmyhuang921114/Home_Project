[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-object-retrieval"
version = "0.1.0"
description = "Semantic-map retrieval and agent runtime prototype."
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]==3.2.9",
    "python-dotenv==1.0.1",
    "PyYAML>=6,<7",
    "textual>=0.89.1,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
